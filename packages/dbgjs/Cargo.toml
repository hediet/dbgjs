[package]
name = "dbgjs"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
atomic-write-file = "0.3"
base64 = "0.22"
cdp-protocol = { path = "../cdp-protocol" }
futures-util = "0.3"
fs2 = "0.4"
getrandom = "0.3"
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
linkrpc.workspace = true
linkrpc-tokio.workspace = true
im = "15.1"
libc = "0.2"
schemars = "0.8"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "=0.10.9"
sourcemap = "=9.3.2"
sysinfo = "0.37"
percent-encoding = "2"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.28"
terminal_size = "0.4"
unicode-width = "0.2"
url = { version = "2", features = ["serde"] }
oxc_allocator = "0.110.0"
oxc_ast = "0.110.0"
oxc_parser = "0.110.0"
oxc_span = "0.110.0"
oxc_ast_visit = "0.110.0"
oxc_syntax = "0.110.0"
oxc_codegen = "0.110.0"
globset = "0.4"
rayon = "1.12.0"
regex = "1"
reqwest = "0.12"
jsonschema = { version = "0.33.0", default-features = false }
tempfile = "3"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "time"] }

[[bench]]
name = "source_search"
harness = false

[[bench]]
name = "capture_persistence"
harness = false
