name: Upload npm package set
description: One publishable npm package per GitHub artifact
inputs:
  channel:
    description: nightly or stable
    required: true
runs:
  using: composite
  steps:
    - uses: actions/upload-artifact@v7
      with:
        name: npm-${{ inputs.channel }}-dbgjs
        path: artifacts/release/npm-${{ inputs.channel }}-dbgjs/*.tgz
        if-no-files-found: error
        overwrite: true
    - uses: actions/upload-artifact@v7
      with:
        name: npm-${{ inputs.channel }}-win32-x64
        path: artifacts/release/npm-${{ inputs.channel }}-win32-x64/*.tgz
        if-no-files-found: error
        overwrite: true
    - uses: actions/upload-artifact@v7
      with:
        name: npm-${{ inputs.channel }}-win32-arm64
        path: artifacts/release/npm-${{ inputs.channel }}-win32-arm64/*.tgz
        if-no-files-found: error
        overwrite: true
    - uses: actions/upload-artifact@v7
      with:
        name: npm-${{ inputs.channel }}-linux-x64-gnu
        path: artifacts/release/npm-${{ inputs.channel }}-linux-x64-gnu/*.tgz
        if-no-files-found: error
        overwrite: true
    - uses: actions/upload-artifact@v7
      with:
        name: npm-${{ inputs.channel }}-linux-arm64-gnu
        path: artifacts/release/npm-${{ inputs.channel }}-linux-arm64-gnu/*.tgz
        if-no-files-found: error
        overwrite: true
    - uses: actions/upload-artifact@v7
      with:
        name: npm-${{ inputs.channel }}-darwin-arm64
        path: artifacts/release/npm-${{ inputs.channel }}-darwin-arm64/*.tgz
        if-no-files-found: error
        overwrite: true
