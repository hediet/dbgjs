name: Release packages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.id == github.event.repository.id &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare release packages
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: node scripts/npm-release.mjs prepare
      - name: Upload nightly packages
        if: steps.prepare.outputs.nightly == 'true'
        uses: ./.github/actions/upload-npm
        with:
          channel: nightly
      - name: Upload stable packages
        if: steps.prepare.outputs.stable == 'true'
        uses: ./.github/actions/upload-npm
        with:
          channel: stable
      - name: Finalize stable tag
        if: steps.prepare.outputs.stable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/npm-release.mjs finalize
