name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  changes:
    name: Detect build inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.changes.outputs.rust }}
      packages: ${{ steps.changes.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test change detection
        run: node --test scripts/ci-changes.test.mjs
      - name: Detect changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/ci-changes.mjs

  rust:
    name: Test (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install JavaScript build inputs
        run: npm ci
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-debug
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build workspace binaries
        run: cargo build --locked --workspace --bins
      - name: Test workspace
        run: cargo test --locked --workspace
      - name: Test offline recordings
        run: npm run test:offline

  packages:
    name: Package (${{ matrix.platform }})
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            platform: win32-x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux-arm64-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: darwin-x64
          - os: macos-15
            target: aarch64-apple-darwin
            platform: darwin-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install JavaScript build inputs
        run: npm ci
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build distribution binaries
        run: cargo build --locked --release --workspace --bin dbgjs --bin dbgjs-service --bin dbgjs-tui
      - name: Test npm packaging
        run: node --test scripts/npm-platform.test.mjs
      - name: Pack npm tarballs
        run: node scripts/npm-pack.mjs --platform ${{ matrix.platform }} --bin-dir target/release --output artifacts/npm
      - name: Upload npm tarballs
        uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.platform }}
          path: artifacts/npm/*.tgz
          if-no-files-found: error

  package-smoke-linux:
    name: Runtime smoke (${{ matrix.platform }})
    needs: [changes, packages]
    if: needs.changes.outputs.packages == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64-gnu
          - os: ubuntu-22.04-arm
            platform: linux-arm64-gnu
    runs-on: ${{ matrix.os }}
    container: ubuntu:22.04
    timeout-minutes: 15
    steps:
      - name: Install declared system dependencies
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates libssl3
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: npm-${{ matrix.platform }}
          path: artifacts/npm
      - name: Report native library dependencies
        shell: bash
        run: |
          mkdir artifacts/native-package
          tar -xzf artifacts/npm/hediet-dbgjs-${{ matrix.platform }}-*.tgz -C artifacts/native-package
          for executable in artifacts/native-package/package/bin/*; do
            echo "$executable"
            dependencies="$(ldd "$executable")"
            echo "$dependencies"
            if echo "$dependencies" | grep -q "not found"; then
              exit 1
            fi
          done
      - name: Test downloaded npm tarballs
        run: node scripts/npm-smoke.mjs --platform ${{ matrix.platform }} --artifacts artifacts/npm

  package-smoke-hosted:
    name: Artifact smoke (${{ matrix.platform }})
    needs: [changes, packages]
    if: needs.changes.outputs.packages == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: win32-x64
          - os: macos-15-intel
            platform: darwin-x64
          - os: macos-15
            platform: darwin-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: npm-${{ matrix.platform }}
          path: artifacts/npm
      - name: Test downloaded npm tarballs
        run: node scripts/npm-smoke.mjs --platform ${{ matrix.platform }} --artifacts artifacts/npm

  result:
    name: CI result
    if: always()
    needs: [changes, rust, packages, package-smoke-linux, package-smoke-hosted]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require successful applicable jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node <<'NODE'
          const results = JSON.parse(process.env.RESULTS);
          if (results.changes.result !== "success") {
            throw new Error(`Change detection ${results.changes.result}`);
          }
          const requiredOutputs = {
            rust: "rust",
            packages: "packages",
            "package-smoke-linux": "packages",
            "package-smoke-hosted": "packages",
          };
          for (const [name, output] of Object.entries(requiredOutputs)) {
            const required = results.changes.outputs[output] === "true";
            const expected = required ? "success" : "skipped";
            if (results[name].result !== expected) {
              throw new Error(`${name}: expected ${expected}, got ${results[name].result}`);
            }
          }
          console.log("All applicable CI jobs passed.");
          NODE
