name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  changes:
    name: Detect build inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.changes.outputs.rust }}
      packages: ${{ steps.changes.outputs.packages }}
      tests: ${{ steps.changes.outputs.tests }}
      test_matrix: ${{ steps.changes.outputs.test_matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Test change detection and generated documentation
        run: node --test scripts/ci-changes.test.mjs tests/readme/transcript.test.mjs scripts/npm-release.test.mjs scripts/npm-release-pack.test.mjs tests/vscode-discovery/transcript.test.mjs tests/process_tree_platform.test.mjs
      - name: Detect changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/ci-changes.mjs

  extension:
    name: Test VS Code extension
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - name: Install extension dependencies
        run: npm --prefix vscode-extension ci
      - name: Typecheck, build, and test extension
        run: npm --prefix vscode-extension test

  contracts:
    name: Check generated contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install JavaScript build inputs
        run: npm ci
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          key: contracts-debug
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check generated CDP Rust bindings
        run: npm run check:cdp
      - name: Check TypeScript contracts against daemon reflection
        run: npm run check:contracts

  rust:
    name: Test (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.test_matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install JavaScript build inputs
        run: npm ci
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-debug
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build workspace binaries
        run: cargo build --locked --workspace --bins
      - name: Test workspace
        run: cargo test --locked --workspace
      - name: Test bounded Playwright helper phases
        run: node --test tests/playwright-page-helper.test.mjs
      - name: Test isolated Electron process-tree webview
        if: runner.os == 'Windows'
        env:
          DBGJS_TEST_BIN_DIR: target/debug
        run: npx playwright test tests/playwright/electron-process-tree.spec.mjs
      - name: Test offline recordings
        run: npm run test:offline
      - name: Test generated TypeScript heap streaming against Rust daemon
        if: runner.os == 'Linux'
        run: |
          npm --prefix vscode-extension ci
          npm --prefix vscode-extension run test:heap-streaming

  packages:
    name: Package (${{ matrix.platform }})
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            platform: win32-x64
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            platform: win32-arm64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux-arm64-gnu
          - os: macos-15
            target: aarch64-apple-darwin
            platform: darwin-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install JavaScript build inputs
        run: npm ci
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-release
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build distribution binaries
        run: cargo build --locked --release --workspace --bin dbgjs --bin dbgjs-service --bin dbgjs-tui
      - name: Test npm packaging
        run: node --test scripts/npm-platform.test.mjs scripts/npm-pack.test.mjs
      - name: Pack npm tarballs
        run: node scripts/npm-pack.mjs --platform ${{ matrix.platform }} --bin-dir target/release --output artifacts/npm --candidate
      - name: Upload npm tarballs
        uses: actions/upload-artifact@v7
        with:
          name: npm-${{ matrix.platform }}
          path: artifacts/npm/hediet-dbgjs-${{ matrix.platform }}-*.tar.gz
          if-no-files-found: error
      - name: Upload npm entry package
        if: matrix.platform == 'linux-x64-gnu'
        uses: actions/upload-artifact@v7
        with:
          name: npm-dbgjs
          path: artifacts/npm/hediet-dbgjs-[0-9]*.tar.gz
          if-no-files-found: error

  package-smoke-linux:
    name: Runtime smoke (${{ matrix.platform }})
    needs: [changes, packages]
    if: needs.changes.outputs.packages == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64-gnu
          - os: ubuntu-22.04-arm
            platform: linux-arm64-gnu
    runs-on: ${{ matrix.os }}
    container: ubuntu:22.04
    timeout-minutes: 15
    steps:
      - name: Install declared system dependencies
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates libssl3
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - uses: actions/download-artifact@v8
        with:
          name: npm-${{ matrix.platform }}
          path: artifacts/npm
      - uses: actions/download-artifact@v8
        with:
          name: npm-dbgjs
          path: artifacts/npm
      - name: Report native library dependencies
        shell: bash
        run: |
          mkdir artifacts/native-package
          tar -xzf artifacts/npm/hediet-dbgjs-${{ matrix.platform }}-*.tar.gz -C artifacts/native-package
          for executable in artifacts/native-package/package/bin/*; do
            echo "$executable"
            dependencies="$(ldd "$executable")"
            echo "$dependencies"
            if echo "$dependencies" | grep -q "not found"; then
              exit 1
            fi
          done
      - name: Test downloaded npm tarballs
        run: node scripts/npm-smoke.mjs --platform ${{ matrix.platform }} --artifacts artifacts/npm --candidate

  package-smoke-windows-macos:
    name: Windows/macOS smoke (${{ matrix.platform }})
    needs: [changes, packages]
    if: needs.changes.outputs.packages == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: win32-x64
          - os: windows-11-arm
            platform: win32-arm64
          - os: macos-15
            platform: darwin-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - uses: actions/download-artifact@v8
        with:
          name: npm-${{ matrix.platform }}
          path: artifacts/npm
      - uses: actions/download-artifact@v8
        with:
          name: npm-dbgjs
          path: artifacts/npm
      - name: Test downloaded npm tarballs
        run: node scripts/npm-smoke.mjs --platform ${{ matrix.platform }} --artifacts artifacts/npm --candidate

  vscode-e2e:
    name: VS Code discovery/source maps (${{ matrix.platform }})
    needs: [changes, packages]
    if: needs.changes.outputs.packages == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: win32-x64
          - os: windows-11-arm
            platform: win32-arm64
          - os: ubuntu-22.04
            platform: linux-x64-gnu
          - os: ubuntu-22.04-arm
            platform: linux-arm64-gnu
          - os: macos-15
            platform: darwin-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install Linux desktop runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends xvfb libgtk-3-0 libnss3 libasound2 libgbm1 libxss1 libatk-bridge2.0-0
      - uses: actions/download-artifact@v8
        with:
          name: npm-${{ matrix.platform }}
          path: artifacts/npm
      - name: Extract tested native binaries
        run: |
          mkdir -p artifacts/vscode-native
          tar -xzf artifacts/npm/hediet-dbgjs-*.tar.gz -C artifacts/vscode-native
      - name: Test isolated VS Code discovery and authored TypeScript
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a node tests/vscode-discovery/run.mjs --bin-dir artifacts/vscode-native/package/bin
          else
            node tests/vscode-discovery/run.mjs --bin-dir artifacts/vscode-native/package/bin
          fi
      - name: Upload VS Code E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vscode-e2e-${{ matrix.platform }}
          path: artifacts/vscode-discovery
          if-no-files-found: warn

  readme:
    name: Replay README in real runtimes
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc-debug
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build walkthrough binaries
        run: cargo build --locked --bin dbgjs --bin dbgjs-service
      - name: Validate README rendering and recording
        run: npm run test:readme:render
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Replay the generated README
        run: npm run test:readme
      - name: Upload README investigation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: readme-examples
          path: artifacts/readme
          if-no-files-found: warn

  result:
    name: CI result
    if: always()
    needs: [changes, extension, contracts, rust, packages, package-smoke-linux, package-smoke-windows-macos, vscode-e2e, readme]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require successful applicable jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node <<'NODE'
          const results = JSON.parse(process.env.RESULTS);
          if (results.changes.result !== "success") {
            throw new Error(`Change detection ${results.changes.result}`);
          }
          if (results.readme.result !== "success") {
            throw new Error(`README replay ${results.readme.result}`);
          }
          if (results.extension.result !== "success") {
            throw new Error(`VS Code extension ${results.extension.result}`);
          }
          if (results.contracts.result !== "success") {
            throw new Error(`Generated contracts ${results.contracts.result}`);
          }
          const requiredOutputs = {
            rust: "tests",
            packages: "packages",
            "package-smoke-linux": "packages",
            "package-smoke-windows-macos": "packages",
            "vscode-e2e": "packages",
          };
          for (const [name, output] of Object.entries(requiredOutputs)) {
            const required = results.changes.outputs[output] === "true";
            const expected = required ? "success" : "skipped";
            if (results[name].result !== expected) {
              throw new Error(`${name}: expected ${expected}, got ${results[name].result}`);
            }
          }
          console.log("All applicable CI jobs passed.");
          NODE
