[package]
name = "cdp-tui"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "jsdbg-tui"
path = "src/main.rs"

[dependencies]
cdp_client = { path = "../.." }
crossterm = { version = "0.28", features = ["event-stream"] }
futures-util = "0.3"
ratatui = "0.29"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
url = "2"
