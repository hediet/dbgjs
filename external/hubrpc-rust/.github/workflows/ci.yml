name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test (incl. conformance vectors)
        run: cargo test --workspace

  conformance-vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate vectors and verify they are committed
        working-directory: conformance/generate
        run: |
          node gen.mjs
          if ! git diff --quiet -- ../vectors; then
            echo "Conformance vectors are out of date. Run 'node conformance/generate/gen.mjs' and commit."
            git --no-pager diff -- ../vectors
            exit 1
          fi
