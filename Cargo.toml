[workspace]
members = ["packages/dbgjs", "packages/cdp-protocol", "packages/dbgjs-tui"]
default-members = ["packages/dbgjs"]
resolver = "3"

[workspace.dependencies]
linkrpc = "=0.3.0-next.20261022.5"
linkrpc-tokio = "=0.3.0-next.20261022.5"

[profile.dev]
debug = 1

[profile.test]
debug = 1

# Distribution builds. A smaller executable also starts faster: on Windows, Defender scans the
# whole unsigned executable on every launch. Panics keep unwinding so a failed service task does
# not abort the service.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "debuginfo"
