[package]
name = "cdp_client"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
async-trait = "0.1"
atomic-write-file = "0.3"
base64 = "0.22"
futures-util = "0.3"
fs2 = "0.4"
getrandom = "0.3"
hubrpc = { path = "../hubrpc-rust/crates/hubrpc" }
hubrpc-tokio = { path = "../hubrpc-rust/crates/hubrpc-tokio" }
libc = "0.2"
schemars = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "=0.10.9"
sourcemap = "=9.3.2"
percent-encoding = "2"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.28"
url = "2"
oxc_allocator = "0.146.0"
oxc_ast = "0.146.0"
oxc_parser = "0.146.0"
oxc_span = "0.146.0"
oxc_ast_visit = "0.146.0"
oxc_syntax = "0.146.0"

[build-dependencies]
hubrpc = { path = "../hubrpc-rust/crates/hubrpc" }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "time"] }
